<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contoso Bank — Core Banking & CRM Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="./assets/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%237a1f2b'/%3E%3Ctext x='16' y='22' font-size='16' font-family='Arial' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div class="brand-text">
        <div class="brand-name">Contoso Bank</div>
        <div class="brand-sub">Core Banking &amp; CRM Console</div>
      </div>
    </div>
    <nav class="bu-nav" id="buNav" aria-label="Business units"></nav>
    <div class="topbar-right">
      <span class="pill pill-synthetic" title="All data is synthetic / fictional">SYNTHETIC DATA</span>
      <span class="meta-date" id="asOfDate"></span>
    </div>
  </header>

  <!-- Body -->
  <main class="layout" id="appRoot">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div>Loading Contoso Bank ledger…</div>
    </div>
  </main>

  <footer class="footer">
    <span id="footerMeta"></span>
    <span class="footer-note">Fictional data for demonstration only — no real customers, accounts or identifiers.</span>
  </footer>

  <script src="./assets/app.js"></script>
</body>
</html>
